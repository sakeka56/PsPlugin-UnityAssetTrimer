<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="panel.css"></head>
<body>
  <div class="panel">
    <header><div class="brand">UNITY ASSET TRIM <span>1.1.0</span></div><select id="language" aria-label="Language"><option value="zh">简体中文</option><option value="en">English</option></select></header>
    <h2 id="heading"></h2><p class="muted" id="intro"></p>
    <div class="document"><span class="eyebrow" id="documentLabel"></span><div id="documentName"></div></div>
    <section>
      <label class="check"><input type="checkbox" id="even" checked><span id="evenLabel"></span></label>
      <label class="field"><span id="alphaLabel"></span><input id="alpha" type="number" min="0" max="254" step="1" value="1"></label>
      <label class="field"><span id="paddingLabel"></span><input id="padding" type="number" min="0" max="4096" step="1" value="0"></label>
    </section>
    <button id="trim" class="primary"></button><p class="hint" id="trimHint"></p>
    <button id="export"></button><p class="hint" id="exportHint"></p>
    <div class="divider"></div><button id="batch"></button><p class="hint" id="batchHint"></p>
    <p id="status" role="status"></p>
  </div>
  <script src="panel.js"></script>
</body></html>
